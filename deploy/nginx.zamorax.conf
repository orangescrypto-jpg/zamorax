# deploy/nginx.zamorax.conf
# Copy to /etc/nginx/sites-available/zamorax, symlink into sites-enabled, then:
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d zamorax.com -d www.zamorax.com      # adds HTTPS + redirect
#
# Replace zamorax.com with your domain.

server {
    listen 80;
    server_name zamorax.com www.zamorax.com;

    # Image uploads go through /api/upload. Vercel capped request bodies at ~4.5 MB;
    # on your own server this line is the limit, so choose it deliberately.
    client_max_body_size 25m;

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ── Client IP (matters!) ─────────────────────────────────────────────────
        # middleware.ts and lib/rateLimit.ts identify users by these headers. Without them
        # every visitor is "unknown" and they ALL share one rate-limit bucket.
        # We OVERWRITE (not append) so a visitor cannot spoof their IP by sending their own
        # X-Forwarded-For header, which nginx would otherwise pass along.
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $remote_addr;

        # If the domain is proxied through Cloudflare (orange cloud), $remote_addr is
        # Cloudflare's address, not the visitor's. In that case use these two instead:
        #   proxy_set_header X-Real-IP        $http_cf_connecting_ip;
        #   proxy_set_header X-Forwarded-For  $http_cf_connecting_ip;
        # (and firewall port 80/443 to Cloudflare's IP ranges so the header can't be forged).

        proxy_read_timeout 60s;
    }
}
